    caption: |-
      Assembly instructions for the Keychain Tote.
      Tools required: none. Zips: none.

      1. Hold it by the keys. 2. Unsnap, let it drop. 3. Two shakes, straps up. 4. Shoulder it.
      Folding back is steps 1–4 in reverse, roughly.

      Fair warning: it runs a little smaller than you might expect. Groceries, gym kit, the impulse buy: yes.
      everfold.online (link in bio)
